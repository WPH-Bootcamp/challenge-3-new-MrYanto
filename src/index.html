      <svg
        id="menu-icon"

        height="24"
        viewBox="0 0 24 24"

        class="block lg:hidden"

      <button
        id="navbar-btn"
        class="btn lg:block lg:static lg:w-[197px] hidden absolute top-[calc(100%*4.3)] w-[calc(100%-32px)]"
      >
        Let's Talk
      </button>
    </header>
  </body>

  <script>
    const menu = document.getElementById('menu-icon');
    const close = document.getElementById('close-icon');
    const nav = document.getElementById('navbar');
    const navbtn = document.getElementById('navbar-btn');

    function openMenu() {
      menu.classList.add('hidden');
      close.classList.remove('hidden');
      nav.classList.remove('hidden');
      navbtn.classList.remove('hidden');
      nav.classList.add('flex', 'flex-col');
    }

    function closeMenu() {
      close.classList.add('hidden');
      nav.classList.add('hidden');
      navbtn.classList.add('hidden');
      nav.classList.remove('flex', 'flex-col');
      menu.classList.remove('hidden');
    }
  </script>
